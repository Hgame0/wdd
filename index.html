<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>私人页面</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 16px/1.6 system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      form { display: flex; flex-direction: column; gap: 10px; width: min(320px, 86vw); }
      input, button { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: inherit; }
      button { background: #3a5fcd; border-color: #3a5fcd; color: #fff; }
      button:disabled { opacity: 0.6; }
      #msg { min-height: 1.6em; color: #f08080; font-size: 14px; }
    </style>
  </head>
  <body>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="wudidong" autocomplete="username" hidden />
      <input id="pw" type="password" placeholder="密码" autocomplete="current-password" required />
      <button id="go">进入</button>
      <div id="msg"></div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id);
      const msg = (t) => ($("msg").textContent = t);
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open("wudidong-lock", 1);
          req.onupgradeneeded = () => req.result.createObjectStore("k");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function idb(mode, fn) {
        const db = await openDb();
        return new Promise((resolve) => {
          const req = fn(db.transaction("k", mode).objectStore("k"));
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => resolve(null);
        });
      }

      async function enter() {
        const reg = await navigator.serviceWorker.ready;
        reg.active.postMessage("key-changed");
        const params = new URLSearchParams(location.search);
        params.delete("locked");
        const query = params.toString();
        location.replace("game.html" + (query ? "?" + query : ""));
      }

      async function unlock(password) {
        const meta = await (await fetch("meta.json", { cache: "no-store" })).json();
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt: b64(meta.salt), iterations: meta.iterations },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        const check = b64(meta.check);
        try {
          await crypto.subtle.decrypt({ name: "AES-GCM", iv: check.slice(0, 12) }, key, check.slice(12));
        } catch {
          return null;
        }
        return key;
      }

      const supported = "serviceWorker" in navigator && window.isSecureContext;
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!supported) return;
        $("go").disabled = true;
        msg("验证中…");
        const key = await unlock($("pw").value);
        if (!key) {
          msg("密码错误");
          $("go").disabled = false;
          return;
        }
        await idb("readwrite", (s) => s.put(key, "key"));
        enter();
      });

      if (!supported) {
        msg("此浏览器不支持（需要 HTTPS 与 Service Worker）");
        $("go").disabled = true;
      } else {
        navigator.serviceWorker.register("sw.js");
        const locked = new URLSearchParams(location.search).has("locked");
        if (locked) msg("请重新输入密码");
        else idb("readonly", (s) => s.get("key")).then((key) => key && enter());
      }
    </script>
  </body>
</html>
