<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>私人页面</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 16px/1.6 system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      form { display: flex; flex-direction: column; gap: 10px; width: min(320px, 86vw); }
      input, button { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: inherit; }
      button { background: #3a5fcd; border-color: #3a5fcd; color: #fff; }
      button:disabled { opacity: 0.6; }
      #msg { min-height: 1.6em; color: #f08080; font-size: 14px; }
    </style>
  </head>
  <body>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="wudidong" autocomplete="username" hidden />
      <input id="pw" type="password" placeholder="密码" autocomplete="current-password" required />
      <button id="go">进入</button>
      <div id="msg"></div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id);
      const msg = (t) => ($("msg").textContent = t);
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      /** 密钥只由 Service Worker 保管：登录页把密钥交给它，收到确认后才跳转 */
      async function worker() {
        const reg = await navigator.serviceWorker.ready;
        const next = reg.installing || reg.waiting;
        if (next) {
          await new Promise((resolve) => {
            next.addEventListener("statechange", () => next.state === "activated" && resolve());
            setTimeout(resolve, 5000);
          });
        }
        return reg.active;
      }
      async function ask(message, transfer = []) {
        const sw = await worker();
        return new Promise((resolve) => {
          const ch = new MessageChannel();
          const timer = setTimeout(() => resolve({ ok: false, error: "后台脚本无响应，请刷新页面重试" }), 8000);
          ch.port1.onmessage = (e) => {
            clearTimeout(timer);
            resolve(e.data);
          };
          sw.postMessage(message, [ch.port2, ...transfer]);
        });
      }

      function enter() {
        const params = new URLSearchParams(location.search);
        params.delete("locked");
        const query = params.toString();
        location.replace("game.html" + (query ? "?" + query : ""));
      }

      async function unlock(password) {
        const meta = await (await fetch("meta.json", { cache: "no-store" })).json();
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
        const raw = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(meta.salt), iterations: meta.iterations }, base, 256);
        const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
        const check = b64(meta.check);
        try {
          await crypto.subtle.decrypt({ name: "AES-GCM", iv: check.slice(0, 12) }, key, check.slice(12));
        } catch {
          return null;
        }
        return raw;
      }

      const supported = "serviceWorker" in navigator && window.isSecureContext;
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!supported) return;
        $("go").disabled = true;
        msg("验证中…");
        const raw = await unlock($("pw").value);
        if (!raw) {
          msg("密码错误");
          $("go").disabled = false;
          return;
        }
        const r = await ask({ type: "set-key", raw }, [raw]);
        if (!r.ok) {
          msg("保存登录状态失败：" + (r.error ?? "未知错误"));
          $("go").disabled = false;
          return;
        }
        enter();
      });

      const reasons = { nokey: "登录状态没有保存下来，请再输入一次密码", badkey: "密码已更换，请输入新密码" };
      if (!supported) {
        msg("此浏览器不支持（需要 HTTPS 与 Service Worker）");
        $("go").disabled = true;
      } else {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => reg.update().catch(() => {}));
        const locked = new URLSearchParams(location.search).get("locked");
        if (locked !== null) msg(reasons[locked] ?? "请重新输入密码");
        else ask({ type: "has-key" }).then((r) => r.ok && enter());
      }
    </script>
  </body>
</html>
